<div id="user-card-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-content user-card-content">
        <div class="user-card-header">
            <button id="user-card-close-btn" class="modal-close">&times;</button>
        </div>
        <div class="user-card-body">
            <div class="user-card-photo-container">
                <img src="" alt="Profil Resmi" id="user-card-photo">
            </div>
            <h3 id="user-card-fullname"></h3>
            <div class="user-card-info">
                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span id="user-card-email"></span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <span id="user-card-phone"></span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-cake-candles"></i>
                    <span id="user-card-birthday"></span>
                </div>
            </div>
        </div>
    </div>
</div>
